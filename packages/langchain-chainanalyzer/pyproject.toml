[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-chainanalyzer"
dynamic = ["version"]
description = "LangChain tools for ChainAnalyzer blockchain AML screening: sanctions, known-hack exposure, stablecoin freeze status and risk score across 12 chains. Pay per call in USDC via x402 or use an API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "refinancier, inc." }]
keywords = ["langchain", "ai-agents", "tools", "aml", "kyt", "sanctions", "crypto", "blockchain", "x402", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1.0,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
x402 = ["x402[httpx,evm]>=2.26,<3", "eth-account>=0.13,<1"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://chain-analyzer.com"
Documentation = "https://chain-analyzer.com/en/docs/ai-agents#frameworks"
Source = "https://github.com/rascal-3/chainanalyzer-mcp/tree/main/packages/langchain-chainanalyzer"
Issues = "https://github.com/rascal-3/chainanalyzer-mcp/issues"

[tool.hatch.version]
path = "src/langchain_chainanalyzer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_chainanalyzer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
